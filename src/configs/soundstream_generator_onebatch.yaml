defaults:
  - soundstream_onebatch_identity
  - override /dataloader: librispeech_generator_onebatch
  - _self_

generator_loss_function:
  lambda_adv: 0.0
  lambda_feat: 0.0
  lambda_rec: 1.0

generator_optimizer:
  lr: 1e-3

discriminator_optimizer:
  lr: 0.0

trainer:
  n_epochs: 20
  epoch_len: 500
  log_step: 50

datasets:
  train:
    limit: 6
    shuffle_index: false
  val:
    limit: 6
    shuffle_index: false
